name: Build images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up upstream WordPress, PHP and Debian updates
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: cedyrn/wordpress-parent

jobs:
  matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      build-date: ${{ steps.build-date.outputs.build-date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate matrix
        id: matrix
        run: |
          include=$(.github/scripts/matrix.sh)
          echo "include=${include}" >> "$GITHUB_OUTPUT"
          echo "${include}" | jq .

      # Recorded in each image's build info. Set once so every image in a
      # build has the same date.
      - name: Build date
        id: build-date
        run: echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ matrix.tags }}

      # Outside pull requests the image is pushed by digest only (no tag), with
      # provenance and an SBOM. That exact digest is then pulled, tested and
      # tagged, so the image that is tested is exactly the image that is
      # published. Pull requests build into the local engine instead.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            WORDPRESS_VERSION=${{ matrix.wordpress }}
            PHP_VERSION=${{ matrix.php }}
            BUILD_DATE=${{ needs.matrix.outputs.build-date }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || format('type=docker,name=wordpress-parent-test:{0}', matrix.name) }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Select image to test
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="wordpress-parent-test:${{ matrix.name }}"
          else
            ref="${IMAGE}@${DIGEST}"
            docker pull "${ref}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: tests/smoke-test.sh "${{ steps.image.outputs.ref }}" "${{ matrix.wordpress }}" "${{ matrix.php }}"

      - name: Tag
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set --
          for tag in ${TAGS}; do
            set -- "$@" -t "${tag}"
          done
          docker buildx imagetools create "$@" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:${{ matrix.name }}"

  # Single required status check for branch protection, independent of
  # which versions are in the matrix.
  result:
    name: Build result
    needs: [matrix, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all builds passed
        run: |
          test "${{ needs.matrix.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
