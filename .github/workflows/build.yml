name: Build images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up upstream WordPress, PHP and Debian updates
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: cedyrn/wordpress-parent

jobs:
  build:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The tags Docker Hub autobuilds published: -latest is PHP 8.4,
        # -future is PHP 8.5
        include:
          - dir: wp7.1
            wordpress: "7.1"
            php: "8.4"
            tags: |
              type=raw,value=7.1-latest
              type=raw,value=latest
          - dir: wp7.1-php8.5
            wordpress: "7.1"
            php: "8.5"
            tags: type=raw,value=7.1-future
          - dir: wp7.0
            wordpress: "7.0"
            php: "8.4"
            tags: type=raw,value=7.0-latest
          - dir: wp7.0-php8.5
            wordpress: "7.0"
            php: "8.5"
            tags: type=raw,value=7.0-future
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ matrix.tags }}

      # Built into the local Docker engine so the image that is tested is
      # exactly the image that is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.dir }}
          pull: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        run: tests/smoke-test.sh "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" "${{ matrix.wordpress }}" "${{ matrix.php }}"

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "${IMAGE}"

  # Single required status check for branch protection, independent of
  # which versions are in the matrix.
  result:
    name: Build result
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all builds passed
        run: test "${{ needs.build.result }}" = "success"
